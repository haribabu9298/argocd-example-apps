apiVersion: batch/v1
kind: Job
metadata:
  name: my-job
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    metadata: {}
    spec:
      containers:
      - command: [ "sh", "-c", "echo \"Running database migrations...\"" , "sleep 10"]
        image: busybox
        name: my-job
        resources: {}
      restartPolicy: Never
status: {}
